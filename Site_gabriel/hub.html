<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviario Sonoro</title>
    <link rel="stylesheet" href="hub.css">
</head>
<body>
    <header class="barra-site">
        <nav>
            <a class="marca" href="hub.html">Aviario Sonoro</a>
            <div class="links-nav">
                <a href="catalogo.html">Catalogo</a>
                <a href="perfil.html">Perfil</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <main class="layout-social">
        <aside class="painel lateral">
            <div class="mini-perfil">
                <div class="avatar" id="avatarHub">AS</div>
                <div>
                    <strong id="nomeHub">Visitante do Aviario</strong>
                    <span id="usuarioHub">@visitante</span>
                </div>
            </div>
            <a class="botao-link" href="cadastro.html">Criar perfil</a>
            <a class="link-secundario" href="perfil.html">Ver meu perfil</a>
        </aside>

        <section class="feed">
            <div class="composer painel">
                <p class="etiqueta">feed aviario</p>
                <h1>O que esta cantando hoje?</h1>
                <p id="frase-do-dia"></p>
                <form id="formNovoPost" class="campo-post">
                    <textarea id="textoPost" placeholder="Compartilhe um canto, uma foto ou uma fofoca de passaros..." required></textarea>
                    <button type="submit">Publicar</button>
                </form>
                <p class="mensagem" id="mensagemPost"></p>
            </div>

            <div id="listaFeed"></div>
        </section>

        <aside class="painel tendencias">
            <h2>Em alta</h2>
            <a href="catalogo.html">#CantoDoTucano</a>
            <a href="catalogo.html">#BemTeViNews</a>
            <a href="catalogo.html">#CalopsitaTalk</a>
        </aside>
    </main>

    <div class="cursor"></div>
    <script src="armazenamento.js"></script>
    <script src="cursor.js"></script>
    <script src="hub.js"></script>
</body>
</html>
